<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>계산기</title>
  <style>
    :root {
      --bg: #f2f3f5;
      --panel: #ffffff;
      --text: #1d1f23;
      --muted: #7a7f88;
      --key: #eef0f3;
      --key-hover: #e2e5ea;
      --fn: #d9dde3;
      --op: #ff9f0a;
      --op-text: #ffffff;
      --shadow: 0 10px 30px rgba(0, 0, 0, .08);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111214;
        --panel: #1c1d20;
        --text: #f4f5f7;
        --muted: #8b9099;
        --key: #2c2e33;
        --key-hover: #383b41;
        --fn: #4a4d54;
        --shadow: 0 10px 30px rgba(0, 0, 0, .4);
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
    }
    .calc {
      width: 100%;
      max-width: 360px;
      background: var(--panel);
      border-radius: 24px;
      padding: 20px;
      box-shadow: var(--shadow);
    }
    .display {
      text-align: right;
      padding: 12px 8px 20px;
      min-height: 110px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      overflow: hidden;
    }
    .expr {
      color: var(--muted);
      font-size: 18px;
      min-height: 24px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .result {
      font-size: 48px;
      font-weight: 300;
      line-height: 1.1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-variant-numeric: tabular-nums;
    }
    .keys {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }
    button {
      font: inherit;
      font-size: 22px;
      height: 64px;
      border: 0;
      border-radius: 16px;
      background: var(--key);
      color: var(--text);
      cursor: pointer;
      transition: background .12s, transform .06s;
      -webkit-tap-highlight-color: transparent;
    }
    button:hover { background: var(--key-hover); }
    button:active { transform: scale(.96); }
    button:focus-visible { outline: 2px solid var(--op); outline-offset: 2px; }
    .fn { background: var(--fn); }
    .op { background: var(--op); color: var(--op-text); }
    .op:hover { filter: brightness(1.08); background: var(--op); }
    .op.active { background: var(--op-text); color: var(--op); }
    .zero { grid-column: span 2; }
  </style>
</head>
<body>
  <main class="calc" aria-label="계산기">
    <div class="display">
      <div class="expr" id="expr"></div>
      <div class="result" id="result" aria-live="polite">0</div>
    </div>
    <div class="keys">
      <button class="fn" data-action="clear" id="clearBtn">AC</button>
      <button class="fn" data-action="sign">±</button>
      <button class="fn" data-action="percent">%</button>
      <button class="op" data-op="/">÷</button>

      <button data-num="7">7</button>
      <button data-num="8">8</button>
      <button data-num="9">9</button>
      <button class="op" data-op="*">×</button>

      <button data-num="4">4</button>
      <button data-num="5">5</button>
      <button data-num="6">6</button>
      <button class="op" data-op="-">−</button>

      <button data-num="1">1</button>
      <button data-num="2">2</button>
      <button data-num="3">3</button>
      <button class="op" data-op="+">+</button>

      <button class="zero" data-num="0">0</button>
      <button data-action="dot">.</button>
      <button class="op" data-action="equals">=</button>
    </div>
  </main>

  <script>
    const SYMBOL = { "+": "+", "-": "−", "*": "×", "/": "÷" };
    const resultEl = document.getElementById("result");
    const exprEl = document.getElementById("expr");
    const clearBtn = document.getElementById("clearBtn");

    let current = "0";      // 지금 입력 중인 숫자
    let previous = null;    // 앞에 입력한 숫자
    let operator = null;    // 선택한 연산자
    let fresh = false;      // 다음 숫자 입력 시 새로 시작할지

    function format(str) {
      if (str === "오류") return str;
      const [int, dec] = str.split(".");
      const sign = int.startsWith("-") ? "-" : "";
      const digits = sign ? int.slice(1) : int;
      const withComma = Number(digits).toLocaleString("en-US");
      return sign + withComma + (dec !== undefined ? "." + dec : "");
    }

    function compute(a, b, op) {
      const x = parseFloat(a), y = parseFloat(b);
      let r;
      switch (op) {
        case "+": r = x + y; break;
        case "-": r = x - y; break;
        case "*": r = x * y; break;
        case "/": if (y === 0) return "오류"; r = x / y; break;
      }
      // 부동소수점 오차 정리 (0.1 + 0.2 = 0.3)
      r = parseFloat(r.toPrecision(12));
      return String(r);
    }

    function render() {
      resultEl.textContent = format(current);
      exprEl.textContent = previous !== null && operator
        ? `${format(previous)} ${SYMBOL[operator]}`
        : "";
      clearBtn.textContent = current !== "0" && !fresh ? "C" : "AC";
      document.querySelectorAll("[data-op]").forEach(b =>
        b.classList.toggle("active", fresh && b.dataset.op === operator));
    }

    function inputNum(n) {
      if (current === "오류" || fresh) { current = "0"; fresh = false; }
      if (current.replace(/[-.]/g, "").length >= 15) return;
      current = current === "0" ? n : current === "-0" ? "-" + n : current + n;
    }

    function inputDot() {
      if (current === "오류" || fresh) { current = "0"; fresh = false; }
      if (!current.includes(".")) current += ".";
    }

    function chooseOp(op) {
      if (current === "오류") return;
      if (operator && !fresh && previous !== null) {
        current = compute(previous, current, operator);
        if (current === "오류") { previous = null; operator = null; fresh = true; return; }
      }
      previous = current;
      operator = op;
      fresh = true;
    }

    function equals() {
      if (operator === null || previous === null) return;
      const expr = `${format(previous)} ${SYMBOL[operator]} ${format(current)} =`;
      current = compute(previous, current, operator);
      previous = null;
      operator = null;
      fresh = true;
      render();
      exprEl.textContent = expr;
    }

    function clear() {
      if (clearBtn.textContent === "C") {
        current = "0";
      } else {
        current = "0"; previous = null; operator = null;
      }
      fresh = false;
    }

    function backspace() {
      if (fresh || current === "오류") return;
      current = current.length > 1 && current !== "-0" ? current.slice(0, -1) : "0";
      if (current === "-") current = "0";
    }

    function sign() {
      if (current === "오류") return;
      current = current.startsWith("-") ? current.slice(1) : "-" + current;
      fresh = false;
    }

    function percent() {
      if (current === "오류") return;
      current = String(parseFloat((parseFloat(current) / 100).toPrecision(12)));
    }

    function handle(key) {
      if (/^\d$/.test(key)) inputNum(key);
      else if (key === ".") inputDot();
      else if (["+", "-", "*", "/"].includes(key)) chooseOp(key);
      else if (key === "=") return equals();
      else if (key === "clear") clear();
      else if (key === "back") backspace();
      else if (key === "sign") sign();
      else if (key === "%") percent();
      render();
    }

    document.querySelector(".keys").addEventListener("click", e => {
      const b = e.target.closest("button");
      if (!b) return;
      const { num, op, action } = b.dataset;
      if (num) handle(num);
      else if (op) handle(op);
      else if (action === "dot") handle(".");
      else if (action === "equals") handle("=");
      else if (action === "clear") handle("clear");
      else if (action === "sign") handle("sign");
      else if (action === "percent") handle("%");
    });

    // 키보드 입력 지원
    document.addEventListener("keydown", e => {
      const k = e.key;
      if (/^\d$/.test(k) || ["+", "-", "*", "/", ".", "%"].includes(k)) handle(k);
      else if (k === "Enter" || k === "=") { e.preventDefault(); handle("="); }
      else if (k === "Backspace") handle("back");
      else if (k === "Escape" || k === "Delete") handle("clear");
      else return;
      e.preventDefault();
    });

    render();
  </script>
</body>
</html>
